<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Saya</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(-45deg,#2193b0,#6dd5ed,#cc2b5e,#753a88);
    background-size:400% 400%;
    animation:bg 10s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
    width:320px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:30px;
    text-align:center;
    color:white;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
    transition:.4s;
}

.card:hover{
    transform:translateY(-10px) scale(1.03);
}

h1{
    margin-top:10px;
}

.bio{
    margin:15px 0 25px;
}

.btn{
    display:inline-block;
    text-decoration:none;
    color:white;
    background:#ff4b2b;
    padding:12px 25px;
    border-radius:30px;
    transition:.3s;
}

.btn:hover{
    background:#ff416c;
}

.btn:active{
    transform:scale(1.1);
}
</style>

</head>
<body>

<div class="card">
    <h1>Ni'am</h1>
    <p class="bio">Siswa SMK TKJ | Belajar HTML & CSS</p>

    <a href="https://www.google.com" class="btn" target="_blank">
        Buka Google
    </a>

    <br><br>

    <a href="https://images.google.com" class="btn" target="_blank">
        Cari Gambar
    </a>

    <br><br>

    <a href="https://www.google.com/search?q=Belajar+HTML" class="btn" target="_blank">
        Belajar HTML
    </a>
</div>

</body>
</html>
